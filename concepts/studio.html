<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eroxii studio slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@600&family=Playfair+Display:wght@500&family=Outfit:wght@700&family=Space+Grotesk:wght@700&family=Sora:wght@700&family=Manrope:wght@800&family=Poppins:wght@700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slide{position:relative;width:1280px;height:720px;overflow:hidden}
.dark{background:#070b18;color:#fff}
.dark::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 560px at 88% -10%,color-mix(in srgb,var(--a) 34%,transparent),transparent 65%),
  radial-gradient(700px 500px at 104% 108%,color-mix(in srgb,var(--a2) 22%,transparent),transparent 60%),
  radial-gradient(520px 420px at -6% 112%,rgba(224,64,251,.12),transparent 70%)}
.light{background:#f5f7fb;color:#0b1733}
.light::before{content:"";position:absolute;inset:0;background:
  radial-gradient(820px 540px at 92% -8%,color-mix(in srgb,var(--a) 20%,transparent),transparent 65%),
  radial-gradient(700px 520px at -8% 110%,rgba(224,64,251,.12),transparent 62%),
  radial-gradient(700px 500px at 102% 104%,color-mix(in srgb,var(--a2) 14%,transparent),transparent 60%)}
.left{position:absolute;left:72px;top:50%;transform:translateY(-50%);width:400px;z-index:3}
.logo-big{width:168px;height:96px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:30px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo-big svg{width:34px;height:34px}
.logo-big b{font-size:27px;color:#0b1733;font-weight:700;letter-spacing:-.04em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
.dark .eyebrow{background:color-mix(in srgb,var(--a) 16%,transparent);color:color-mix(in srgb,var(--a) 55%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 35%,transparent)}
.light .eyebrow{background:color-mix(in srgb,var(--a) 10%,#fff);color:color-mix(in srgb,var(--a) 85%,#000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 22%,transparent)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
h1{font-size:50px;line-height:1.06;font-weight:800;letter-spacing:-.045em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dark h1 em{background-image:linear-gradient(90deg,color-mix(in srgb,var(--a) 70%,#fff),color-mix(in srgb,var(--a2) 85%,#fff))}
h1 i{font-style:normal;color:#e040fb}
.desc{font-size:17px;line-height:1.55;margin-top:20px}
.dark .desc{color:#a6b0c6}.light .desc{color:#5b6680}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{height:32px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;font-weight:500}
.dark .chip{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#e6eaf3}
.light .chip{background:#fff;box-shadow:inset 0 0 0 1px rgba(11,23,51,.1);color:#24304d}
.logo-sm{position:absolute;left:48px;bottom:40px;height:46px;padding:0 16px;border-radius:12px;background:#fff;display:flex;align-items:center;gap:6px;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.logo-sm svg{width:20px;height:20px}
.logo-sm b{font-size:17px;color:#0b1733;font-weight:700;letter-spacing:-.04em}
.count{position:absolute;right:48px;bottom:44px;font-size:14px;font-weight:500;letter-spacing:.06em;z-index:3}
.dark .count{color:#6c7894}.light .count{color:#8a93a8}
.badge{position:absolute;right:22px;bottom:96px;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;border-radius:16px}
.dark .badge{background:rgba(22,26,38,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 16px 40px rgba(0,0,0,.4);color:#fff}
.light .badge{background:rgba(255,255,255,.96);box-shadow:inset 0 0 0 1px rgba(11,23,51,.06),0 16px 40px rgba(30,50,90,.16)}
.badge .bi{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:#fff}
.badge .bi svg{width:16px;height:16px;stroke-width:2.2}
.badge b{display:block;font-size:14px;font-weight:700}
.badge span{display:block;font-size:12px;opacity:.65}
.shadow{box-shadow:0 40px 80px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)}
.light .shadow{box-shadow:0 30px 70px rgba(30,50,90,.18),0 0 0 1px rgba(11,23,51,.06)}

/* ---- tool ---- */
.browser{position:absolute;left:600px;top:104px;width:760px;height:520px;border-radius:14px;overflow:hidden;z-index:1}
.chrome{height:40px;display:flex;align-items:center;padding:0 16px;gap:8px;position:relative}
.dark .chrome{background:#1b1f2b}.light .chrome{background:#f1f3f8}
.chrome i{width:12px;height:12px;border-radius:50%}
.chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.url{position:absolute;left:50%;transform:translateX(-50%);width:340px;height:24px;border-radius:7px;font-size:12px;display:grid;place-items:center}
.dark .url{background:#2a2f3d;color:#c9cfdb}.light .url{background:#e3e7ef;color:#3a4560}
.browser img{display:block;width:100%;height:480px;object-fit:cover;object-position:top left}
.phone{position:absolute;left:500px;top:196px;width:220px;height:462px;border-radius:42px;background:#0c0e13;padding:8px;z-index:2;box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 0 0 1.5px #2c3040}
.screen{position:relative;width:204px;height:446px;border-radius:34px;overflow:hidden;background:#fff}
.screen>img{width:100%;height:100%;object-fit:cover;object-position:top}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:76px;height:22px;border-radius:12px;background:#000;z-index:5}

/* ---- logo board ---- */
.board{position:absolute;left:548px;top:84px;width:692px;height:552px;display:grid;grid-template-columns:440px 240px;grid-template-rows:330px 210px;gap:12px;z-index:1}
.tile{border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center}
.lock{display:flex;align-items:center;gap:18px}
.lock svg{flex:none}
.lock .wm{line-height:1}
.lock .wm b{display:block;font-weight:inherit}
.lock .wm span{display:block;font-family:Inter;font-weight:600;letter-spacing:.22em;margin-top:8px}
.main svg.grid{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.row2{grid-column:span 2;display:grid;grid-template-columns:170px 1fr 190px;gap:12px}
.badge.top{bottom:auto;top:20px}
.appicon{width:116px;height:116px;border-radius:28px;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;width:100%;height:100%}
.sw{min-width:0;border-radius:14px;display:flex;align-items:flex-end;padding:8px 6px;font-size:9.5px;letter-spacing:-.01em;font-weight:600;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.type{padding:18px 20px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.type .aa{font-size:72px;line-height:1}
.type b{font-size:14px}.type span{font-size:12px;opacity:.6}
.neutral{background:#fff}.dark .neutral{background:#141a2b;color:#fff}

/* ---- flyer ---- */
.flyer{position:absolute;width:380px;height:537px;border-radius:10px;overflow:hidden;padding:26px;display:flex;flex-direction:column;font-family:Inter;color:#0f172a;background:#fff}
.flyer.inv{background:var(--s2);color:#fff}
.fl-top{display:flex;justify-content:space-between;align-items:center}
.fl-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.02em}
.fl-brand i{width:28px;height:28px;border-radius:8px;background:var(--ba);display:grid;place-items:center;color:#fff}
.fl-brand i svg{width:16px;height:16px;stroke-width:2.2}
.fl-tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--ba) 14%,transparent);color:var(--ba)}
.inv .fl-tag{background:rgba(255,255,255,.14);color:#fff}
.fl-art{height:170px;border-radius:16px;margin-top:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--s1),var(--s2))}
.inv .fl-art{background:linear-gradient(135deg,var(--ba),var(--ba2))}
.fl-art::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 180px at 80% 10%,rgba(255,255,255,.3),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px)}
.fl-art svg{position:absolute;right:-16px;bottom:-26px;width:200px;height:200px;color:#fff;opacity:.3;stroke-width:1.2}
.fl-art .c1{position:absolute;left:20px;top:20px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16)}
.fl-art .c2{position:absolute;left:62px;top:60px;width:34px;height:34px;border-radius:50%;background:var(--ba2);opacity:.85}
.fl-h{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1.02;margin-top:18px}
.fl-h em{font-style:normal;color:var(--ba)}
.inv .fl-h em{color:color-mix(in srgb,var(--ba2) 70%,#fff)}
.fl-sub{font-size:12.5px;line-height:1.5;margin-top:8px;opacity:.7}
.fl-rows{display:grid;gap:8px;margin-top:14px}
.fl-row{display:flex;align-items:center;gap:10px}
.fl-row i{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--ba) 12%,transparent);color:var(--ba);display:grid;place-items:center;flex:none}
.inv .fl-row i{background:rgba(255,255,255,.12);color:#fff}
.fl-row i svg{width:15px;height:15px}
.fl-row span{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.55;display:block}
.fl-row b{font-size:12.5px}
.fl-foot{margin-top:auto;display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--ba);color:#fff}
.fl-foot b{font-size:15px;display:block}.fl-foot span{font-size:10.5px;opacity:.85}
.qr{width:62px;height:62px;background:#fff;border-radius:8px;padding:5px;margin-left:auto;display:grid;grid-template-columns:repeat(11,1fr);gap:0}
.qr i{background:#0f172a}.qr i.o{background:transparent}

/* ---- ad ---- */
.cre{position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,var(--s1),var(--s2));display:flex;flex-direction:column}
.cre::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 85% 10%,color-mix(in srgb,var(--ba) 70%,transparent),transparent 70%),repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}
.cre>*{position:relative}
.cre .art{position:absolute;right:-8%;bottom:-10%;width:62%;height:62%;opacity:.22;color:#fff;stroke-width:1.1}
.cre .bchip{display:inline-flex;align-items:center;gap:6px;font-weight:700;align-self:flex-start;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.cre .bchip i{border-radius:50%;background:#fff;color:var(--s2);display:grid;place-items:center}
.cre .hd{font-weight:800;letter-spacing:-.045em;line-height:1.02}
.cre .hd em{font-style:normal;color:color-mix(in srgb,var(--ba2) 55%,#fff)}
.cre .sb{opacity:.85}
.cre .bt{align-self:flex-start;border-radius:999px;background:#fff;color:var(--s2);font-weight:800}
.story{position:absolute;left:548px;top:132px;width:236px;height:420px;border-radius:22px;padding:22px;z-index:1;transform:rotate(-4deg)}
.story .bchip{font-size:11px;padding:5px 10px 5px 5px}.story .bchip i{width:20px;height:20px}.story .bchip i svg{width:12px;height:12px}
.story .hd{font-size:29px;margin-top:auto}
.story .sb{font-size:12px;margin-top:8px}
.story .bt{font-size:13px;padding:11px 18px;margin-top:16px}
.story .bars{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:4px}
.story .bars span{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.45)}
.story .bars span:first-child{background:#fff}
.fbphone{position:absolute;left:820px;top:62px;width:290px;height:600px;border-radius:46px;background:#0c0e13;padding:9px;z-index:2;box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 0 0 1.5px #2c3040}
.fbscreen{position:relative;width:272px;height:582px;border-radius:38px;overflow:hidden;background:#f0f2f5;font-size:11px;color:#1c1e21}
.sbar{height:40px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 6px 28px;font-size:12px;font-weight:600;background:#fff}
.fbbar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 10px;background:#fff;border-bottom:1px solid #e4e6eb}
.fbbar b{font-size:19px;letter-spacing:-.03em;color:var(--fb)}
.fbbar span{display:flex;gap:6px}.fbbar span i{width:26px;height:26px;border-radius:50%;background:#e4e6eb;display:grid;place-items:center}
.fbbar span i svg{width:13px;height:13px;stroke-width:2.2}
.post{background:#fff;margin-top:8px}
.ph{display:flex;gap:8px;align-items:center;padding:10px 12px}
.ph .av{width:34px;height:34px;border-radius:50%;background:var(--ba);display:grid;place-items:center;color:#fff}
.ph .av svg{width:18px;height:18px;stroke-width:2}
.ph b{font-size:12px;display:block}.ph span{font-size:10px;color:#65676b}
.ptxt{padding:0 12px 10px;font-size:11.5px;line-height:1.4}
.sq{width:272px;height:272px;padding:20px}
.sq .bchip{font-size:10px;padding:4px 9px 4px 4px}.sq .bchip i{width:18px;height:18px}.sq .bchip i svg{width:11px;height:11px}
.sq .hd{font-size:32px;margin-top:auto}
.sq .sb{font-size:11px;margin-top:6px}
.lbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f0f2f5}
.lbar span{font-size:9.5px;color:#65676b;text-transform:uppercase;display:block}.lbar b{font-size:12px;display:block;max-width:150px}
.lbar em{font-style:normal;font-weight:700;font-size:11.5px;background:#e4e6eb;padding:8px 12px;border-radius:7px}
.react{display:flex;justify-content:space-between;padding:8px 12px;color:#65676b;font-size:10.5px;border-bottom:1px solid #e4e6eb}
.acts{display:flex;justify-content:space-around;padding:8px 0;color:#65676b;font-weight:600;font-size:11px}

/* ---- pattern board ---- */
.pboard{position:absolute;left:548px;top:84px;width:692px;height:552px;display:grid;grid-template-columns:440px 240px;grid-template-rows:330px 210px;gap:12px;z-index:1}
.pboard .tile{border-radius:22px;overflow:hidden;position:relative}
.pboard .tile>svg{display:block}
.plabel{position:absolute;left:14px;top:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.88);color:#0b1733;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.mock{display:grid;place-items:center}
.light .mock{background:linear-gradient(160deg,#eef1f6,#dde3ec)}.dark .mock{background:linear-gradient(160deg,#1a2133,#0f1424)}
.prow{grid-column:span 2;display:grid;grid-template-columns:200px 1fr 170px;gap:12px}
.icons{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.icons .ig{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.icons .ig span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center}
.icons .ig svg{width:30px;height:30px}
.light .icons .ig span{background:#f1f4f9}.dark .icons .ig span{background:rgba(255,255,255,.07)}
.cways{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.cways div{border-radius:14px;overflow:hidden;position:relative}
.cways div span{position:absolute;left:8px;bottom:8px;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.9);color:#0b1733}
.spec{padding:14px 16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.spec .rr{display:flex;justify-content:space-between;font-size:11.5px;gap:8px}
.spec .rr span{opacity:.55}.spec .rr b{font-weight:700;text-align:right}
.spec .tilebox{display:grid;place-items:center;margin-bottom:4px}
.tlbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.55}

/* ---- strategy ---- */
.panel{position:absolute;left:548px;top:84px;width:692px;height:552px;border-radius:26px;z-index:1;padding:26px 28px;display:flex;flex-direction:column}
.light .panel{background:#fff}.dark .panel{background:#10162a;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 80px rgba(0,0,0,.4)}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.ptop b{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.dark .ptop b{color:color-mix(in srgb,var(--a) 60%,#fff)}
.ptop span{font-size:12px;opacity:.55}
.pbody{flex:1;position:relative}
.muted{opacity:.6}
.card2{border-radius:14px;padding:12px 14px}
.light .card2{background:#f4f6fa}.dark .card2{background:rgba(255,255,255,.05)}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.pill{display:inline-flex;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;margin:3px 3px 0 0}
.light .pill{background:#eef1f6}.dark .pill{background:rgba(255,255,255,.08)}
</style>
</head>

   <div style="display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:10px">${Array.from({length:12},(_,i)=>`<span style="flex:1;border-radius:3px;height:${30+((i*37+x[2])%60)}%;background:${i>8?A:"color-mix(in srgb,var(--a) 30%,transparent)"}"></span>`).join("")}</div></div>`).join("")}</div>
   <div class="card2" style="margin-top:14px;font-size:12px;display:flex;justify-content:space-between"><span><b>Weekly review</b> <span class="muted">· every Monday, shared report</span></span><span class="muted">Example targets: real ones depend on industry, offer and market</span></div>`},
calendar(){const t={V:["Value",A],P:["Proof","#ff9f0a"],O:["Offer","#ff375f"],R:["Reel",A2],L:["Live","#bf5af2"]},w=["VRPVROL","PVRVOPR","VRPLVRO","PORVRPO"];

   ${w.map((row,r)=>`<div style="font-weight:700;font-size:12px;align-self:center">Week ${r+1}</div>${[...row].map(c=>`<div style="height:72px;border-radius:10px;background:color-mix(in srgb,${t[c][1]} 18%,transparent);border-left:3px solid ${t[c][1]};padding:8px;font-size:11px;font-weight:700">${t[c][0]}</div>`).join("")}`).join("")}</div>
   <div style="display:flex;gap:14px;margin-top:16px;flex-wrap:wrap">${Object.values(t).map(x=>`<span style="display:flex;align-items:center;gap:6px;font-size:12px"><i style="width:10px;height:10px;border-radius:3px;background:${x[1]}"></i>${x[0]}</span>`).join("")}<span class="muted" style="font-size:12px;margin-left:auto">Ads amplify the top 2 organic posts each week</span></div>`},
scaling(){const r=[["up","ROAS above target for 3 days","Raise budget +20% (max once / 48h)",A],["copy","Ad set stable for 7 days","Duplicate to a new lookalike",A2],["refresh","Frequency above 3 or CTR drops 30%","Refresh creative with a new hook","#ff9f0a"],["pause","CPA above 1.5× target after 2× spend","Pause and move budget","#ff375f"]];
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${r.map(x=>`<div class="card2" style="padding:18px;min-height:190px;display:flex;flex-direction:column;gap:10px">
   <span style="width:44px;height:44px;border-radius:12px;background:${x[3]};color:#fff;display:grid;place-items:center">${ic(x[0]).replace('class="i"','class="i" style="width:22px;height:22px"')}</span>
   <div><div class="lbl">If</div><div style="font-weight:700;font-size:15px;margin-top:2px">${x[1]}</div></div>
   <div style="margin-top:auto"><div class="lbl">Then</div><div style="font-size:14px;margin-top:2px;color:${x[3]};font-weight:700">${x[2]}</div></div></div>`).join("")}</div>`}
};
